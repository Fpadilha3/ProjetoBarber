<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>


  <div class="logo">
    <img src="ChatGPT Image 11 de jun. de 2026, 14_18_03.png" alt="Logo BarberPro">
    <span>BarberGO</span>
   </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamento.html">Agendamentos</a>
        <a href="historico.html">Histórico</a>
    </nav>

</header>

<div class="container">

    <div class="card">

        <h2>Novo Agendamento</h2>

        <select id="agCliente">
            <option value="">--Selecione um cliente--</option>
        </select>

        <select id="agServico">
            <option value="">--Selecione um serviço--</option>
        </select>

        <input
            type="date"
            id="agData"
            onfocus="this.showPicker()"
            oninput="validarDataAgendamento()">

        <select id="agHora">
            <option value="">--Selecione um horário--</option>
        </select>

        <button onclick="agendar()">
            Agendar
        </button>

    </div>

    <div class="card">

        <h2>Agenda</h2>

        <table>

            <thead>

                <tr>
                    <th>Cliente</th>
                    <th>Serviço</th>
                    <th>Data</th>
                    <th>Hora</th>
                    <th>Ações</th>
                </tr>

            </thead>

            <tbody id="listaAgendamentos"></tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
