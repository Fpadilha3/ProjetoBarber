<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        💈 BARBEARIA PITBULLS
    </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="clientes.html">Clientes</a>
        <a href="servicos.html">Serviços</a>
        <a href="agendamento.html">Agendamentos</a>
        <a href="historico.html">Histórico</a>
    </nav>

</header>

<div class="container">

    <div class="card">

        <h2>Cadastrar Serviço</h2>

        <input
            type="text"
            id="nomeServico"
            placeholder="Nome do serviço"
            oninput="validarNomeServico()">

        <input
            type="number"
            id="valorServico"
            placeholder="Valor"
            oninput="validarValorServico()">

        <button onclick="cadastrarServico()">
            Cadastrar Serviço
        </button>

    </div>

    <div class="card">

        <h2>Serviços</h2>

        <table>

            <thead>

                <tr>
                    <th>Serviço</th>
                    <th>Valor</th>
                    <th>Ações</th>
                </tr>

            </thead>

            <tbody id="listaServicos"></tbody>

        </table>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
